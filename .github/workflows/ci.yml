name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          swift --version
          python3 --version
      - name: Swift tests
        run: ./scripts/test.sh
      - name: Installation tests
        run: python3 -m unittest discover -s Tests/Installation
      - name: Package and verify app
        run: ./scripts/package-app.sh
